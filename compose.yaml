services:
  gitstars:
    build:
      context: .
      args:
        VITE_GITSTARS_CLIENT_ID: ${VITE_GITSTARS_CLIENT_ID:?Set VITE_GITSTARS_CLIENT_ID in .env}
    environment:
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in .env}
      TLS_CERT_FILE: /app/cert/localhost.pem
      TLS_KEY_FILE: /app/cert/localhost-key.pem
    ports:
      - "${GITSTARS_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${GITSTARS_CERT_DIR:-./.certs}
        target: /app/cert
        read_only: true
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
